name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Pytest and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install pytest-homeassistant-custom-component ruff
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -v --timeout=60
