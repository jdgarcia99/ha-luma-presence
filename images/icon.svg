<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A93FF"/>
      <stop offset="1" stop-color="#0057E0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect width="512" height="512" rx="114" fill="url(#sheen)"/>
  <!-- glow spilling from the lit window -->
  <circle cx="200" cy="300" r="100" fill="url(#halo)"/>
  <!-- house -->
  <path d="M132 240 L256 136 L380 240 V356 a24 24 0 0 1 -24 24 H156 a24 24 0 0 1 -24 -24 Z"
        fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/>
  <!-- lit window -->
  <rect x="172" y="272" width="56" height="56" rx="12" fill="#FFFFFF"/>
  <!-- window off -->
  <rect x="290" y="278" width="44" height="44" rx="6" fill="none" stroke="#FFFFFF"
        stroke-width="12" stroke-opacity="0.5"/>
</svg>
