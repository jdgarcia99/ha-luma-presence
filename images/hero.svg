<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="A house at dusk with some warm lit windows" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141026"/>
      <stop offset="0.45" stop-color="#3b2347"/>
      <stop offset="0.75" stop-color="#9a4a4a"/>
      <stop offset="1" stop-color="#e6884a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="winGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc56b" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#ff9f43" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff9f43" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2a3"/>
      <stop offset="1" stop-color="#ffb24d"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d2c"/>
      <stop offset="1" stop-color="#1c141f"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb24d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb24d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffbe62" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffbe62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1a22"/>
      <stop offset="1" stop-color="#0d0b10"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="560" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff4dc" opacity="0.75">
    <circle cx="90" cy="60" r="1.2"/><circle cx="210" cy="110" r="1"/><circle cx="330" cy="45" r="1.4"/>
    <circle cx="470" cy="90" r="1"/><circle cx="560" cy="30" r="1.2"/><circle cx="700" cy="70" r="1"/>
    <circle cx="820" cy="40" r="1.3"/><circle cx="1180" cy="95" r="1.1"/><circle cx="1240" cy="40" r="1"/>
    <circle cx="150" cy="170" r="0.9"/><circle cx="640" cy="140" r="0.9"/><circle cx="1100" cy="150" r="0.9"/>
  </g>
  <!-- moon -->
  <circle cx="1010" cy="105" r="90" fill="url(#moonGlow)"/>
  <circle cx="1010" cy="105" r="30" fill="#fff1d0"/>
  <circle cx="1022" cy="96" r="28" fill="#3b2347" opacity="0.25"/>

  <!-- distant hills -->
  <path d="M0 400 C 160 350, 300 370, 420 345 S 700 330, 860 360 S 1120 340, 1280 365 L1280 560 L0 560 Z" fill="#2a1830" opacity="0.9"/>

  <!-- trees left -->
  <g fill="#120d16">
    <path d="M120 470 L160 300 L200 470 Z"/><rect x="155" y="465" width="10" height="30"/>
    <path d="M60 480 L95 340 L130 480 Z"/>
    <ellipse cx="250" cy="420" rx="55" ry="70"/><rect x="246" y="470" width="9" height="30"/>
  </g>
  <!-- trees right -->
  <g fill="#120d16">
    <path d="M1090 480 L1130 310 L1170 480 Z"/><path d="M1160 485 L1190 360 L1220 485 Z"/>
    <ellipse cx="1030" cy="430" rx="50" ry="62"/>
  </g>

  <!-- ground -->
  <rect y="480" width="1280" height="80" fill="url(#ground)"/>

  <!-- window glows (behind house) -->
  <g>
    <circle cx="520" cy="300" r="120" fill="url(#winGlow)"/>
    <circle cx="760" cy="395" r="120" fill="url(#winGlow)"/>
    <circle cx="640" cy="395" r="90" fill="url(#winGlow)" opacity="0.7"/>
  </g>

  <!-- house -->
  <g>
    <polygon points="400,250 640,140 880,250" fill="#1a1219"/>
    <polygon points="380,255 640,128 900,255 890,262 640,140 390,262" fill="#24161f"/>
    <rect x="420" y="250" width="440" height="235" fill="url(#wall)"/>
    <rect x="800" y="160" width="30" height="70" fill="#1a1219"/>
    <!-- floor divider -->
    <rect x="420" y="358" width="440" height="4" fill="#140e15"/>
    <!-- upper windows -->
    <rect x="470" y="275" width="80" height="60" rx="3" fill="url(#win)"/>
    <rect x="600" y="275" width="80" height="60" rx="3" fill="#2f2433"/>
    <rect x="730" y="275" width="80" height="60" rx="3" fill="#2f2433"/>
    <!-- lower windows -->
    <rect x="455" y="385" width="90" height="62" rx="3" fill="#2f2433"/>
    <rect x="595" y="385" width="90" height="62" rx="3" fill="url(#win)" opacity="0.85"/>
    <rect x="715" y="385" width="90" height="62" rx="3" fill="url(#win)"/>
    <!-- mullions -->
    <g stroke="#1a1219" stroke-width="3">
      <line x1="510" y1="275" x2="510" y2="335"/><line x1="470" y1="305" x2="550" y2="305"/>
      <line x1="640" y1="275" x2="640" y2="335"/><line x1="600" y1="305" x2="680" y2="305"/>
      <line x1="770" y1="275" x2="770" y2="335"/><line x1="730" y1="305" x2="810" y2="305"/>
      <line x1="500" y1="385" x2="500" y2="447"/><line x1="640" y1="385" x2="640" y2="447"/><line x1="760" y1="385" x2="760" y2="447"/>
    </g>
    <!-- door -->
    
    <!-- silhouette in lit window -->
    <path d="M748 447 C 748 425, 752 418, 760 416 C 754 412, 754 400, 762 398 C 770 400, 770 412, 764 416 C 772 418, 776 425, 776 447 Z" fill="#7a3f22" opacity="0.55"/>
    <!-- door -->
    
    
  </g>
  <!-- porch light + path glow -->
  
  <ellipse cx="760" cy="497" rx="150" ry="22" fill="url(#pool)"/>
  <ellipse cx="640" cy="497" rx="110" ry="16" fill="url(#pool)" opacity="0.7"/>
  <!-- light spill on the walls -->
  <ellipse cx="510" cy="305" rx="90" ry="70" fill="url(#spill)"/>
  <ellipse cx="640" cy="416" rx="85" ry="60" fill="url(#spill)" opacity="0.8"/>
  <ellipse cx="760" cy="416" rx="95" ry="68" fill="url(#spill)"/>
  <!-- door with porch lamp -->
  <rect x="818" y="398" width="34" height="87" rx="2" fill="#3a2418"/>
  <circle cx="845" cy="442" r="2" fill="#ffcf80"/>
  <circle cx="835" cy="388" r="5" fill="#ffd27a"/>
  <circle cx="835" cy="388" r="28" fill="url(#winGlow)"/>

  <!-- caption -->
  <text x="48" y="528" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#ffd9a6" opacity="0.9">Your home, lived in — even when you are away.</text>
</svg>
